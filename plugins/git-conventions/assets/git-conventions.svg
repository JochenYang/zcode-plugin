<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- git-conventions · "the commit that passes": a check inside a commit, on a line of history.
       Same grid, palette and stroke weight as codegraph. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B3A9E"/>
      <stop offset="0.55" stop-color="#2E3178"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="226" ry="226"/>
    </clipPath>
    <radialGradient id="lift" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#lift)"/>
  </g>
  <!-- history: the commit before, and the line to it -->
  <line x1="406" y1="406" x2="352" y2="352" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="44" stroke-linecap="round"/>
  <circle cx="318" cy="318" r="40" fill="#2DD4BF"/>
  <!-- the commit, and what it says -->
  <circle cx="512" cy="512" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="44"/>
  <path d="M 438 516 L 492 572 L 594 452" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
